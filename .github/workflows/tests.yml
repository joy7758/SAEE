name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  local-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run local check
        run: make check
      - name: Validate public site security boundaries
        run: python3 scripts/saee_public_surface_security_gate.py
