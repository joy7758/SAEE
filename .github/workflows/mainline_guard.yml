name: Mainline Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mainline-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate SAEE mainline scaffold
        run: python3 scripts/mainline_guard.py

